                      $ref: "#/components/schemas/Order"
    post:
      tags: [Commandes]
      summary: Créer une commande (checkout)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderInput"
      responses:
        "201":
          description: Commande créée en PENDING
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      order:
                        $ref: "#/components/schemas/Order"

  /orders/{id}:
    get:
      tags: [Commandes]
      summary: Détail d'une commande
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Fiche commande

  /orders/{id}/cancel:
    post:
      tags: [Commandes]
      summary: Annuler une commande (si non expédiée)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Commande annulée

  /orders/{id}/status:
    patch:
      tags: [Commandes]
      summary: Mettre à jour le statut (Admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [PENDING, PAID, SHIPPED, DELIVERED, CANCELLED, COD_PENDING, COD_FAILED, REFUNDED, PAYMENT_FAILED]
      responses:
        "200":
          description: Statut mis à jour

  # ═══════════════════════════════════════════════════════════════════════════
  # 14. Paiements (Mobile Money Madagascar)
  # ═══════════════════════════════════════════════════════════════════════════
  /payments/initiate:
    post:
      tags: [Paiements (Mobile Money)]
      summary: Initier un paiement Mobile Money
      description: |
        Déclenche une notification Push USSD vers le téléphone de l'acheteur.
        En dev, fonctionne sans clés sandbox configurées (stub).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, provider, phoneNumber]
              properties:
                orderId:
                  type: string
                provider:
                  type: string
                  enum: [MVOLA, ORANGE_MONEY, AIRTEL_MONEY]
                phoneNumber:
                  type: string
                  description: Numéro malgache (ex 0341234567)
      responses:
        "201":
          description: Paiement initié
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      transaction:
                        $ref: "#/components/schemas/PaymentTransaction"
        "409":
          description: Opérateur indisponible ou statut commande invalide

  /payments:
    get:
      tags: [Paiements (Mobile Money)]
      summary: Historique de mes transactions
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [INITIATED, PENDING, SUCCESS, FAILED, CANCELLED, REFUNDED]
        - name: provider
          in: query
          schema:
            type: string
            enum: [MVOLA, ORANGE_MONEY, AIRTEL_MONEY]
      responses:
        "200":
          description: Liste des transactions

  /payments/{transactionId}:
    get:
      tags: [Paiements (Mobile Money)]
      summary: Statut d'une transaction
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Détails de la transaction

  /payments/{transactionId}/refund:
    post:
      tags: [Paiements (Mobile Money)]
      summary: Rembourser une transaction (Admin)
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Remboursement effectué

  /payments/webhooks/{provider}:
    post:
      tags: [Paiements (Mobile Money)]
      summary: Webhook opérateur (signé HMAC-SHA256)
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [MVOLA, ORANGE_MONEY, AIRTEL_MONEY]
        - name: x-signature
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Notification traitée

  # ═══════════════════════════════════════════════════════════════════════════
  # 15. Suivi de livraison (Delivery Tracking)
  # ═══════════════════════════════════════════════════════════════════════════
  /delivery-tracking/my-deliveries:
    get:
      tags: [Suivi de livraison]
      summary: Livraisons actives du livreur connecté
      responses:
        "200":
          description: Liste des livraisons

  /delivery-tracking/my-stats:
    get:
      tags: [Suivi de livraison]
      summary: Statistiques du livreur connecté
      responses:
        "200":
          description: Stats du livreur

  /delivery-tracking/{orderId}/ping:
    post:
      tags: [Suivi de livraison]
      summary: Envoyer une position GPS (Livreur)
      description: Le premier ping assigne le livreur et passe la commande en SHIPPED.
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitude, longitude]
              properties:
                latitude:
                  type: number
                  example: -18.9083
                longitude:
                  type: number
                  example: 47.5244
                accuracy:
                  type: number
                speed:
                  type: number
                heading:
                  type: number
      responses:
        "201":
          description: Ping enregistré

  /delivery-tracking/{orderId}/latest:
    get:
      tags: [Suivi de livraison]
      summary: Dernière position du livreur
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Position actuelle

  /delivery-tracking/{orderId}/history:
    get:
      tags: [Suivi de livraison]
      summary: Historique complet du trajet
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 500
      responses:
        "200":
          description: Historique

