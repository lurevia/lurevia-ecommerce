            type: string
      responses:
        "200":
          description: Suivi arrêté

  # ═══════════════════════════════════════════════════════════════════════════
  # 10. Offres d'enchères (Bids)
  # ═══════════════════════════════════════════════════════════════════════════
  /bids:
    post:
      tags: [Offres d'enchères (Bids)]
      summary: Placer une offre (enchère ou négociation)
      description: |
        Pour AUCTION : vérifie l'incrément minimum et prolonge de 2 min si offre
        dans les dernières 2 minutes (anti-snipe).
        Pour NEGOTIABLE : simple proposition en attente d'acceptation vendeur.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, proposedPrice]
              properties:
                productId:
                  type: string
                proposedPrice:
                  type: integer
                  description: En Ariary (MGA)
                  example: 125000
                comment:
                  type: string
                  maxLength: 500
      responses:
        "201":
          description: Offre enregistrée
        "409":
          description: Offre trop basse ou produit non éligible

  /bids/me:
    get:
      tags: [Offres d'enchères (Bids)]
      summary: Historique de mes offres
      responses:
        "200":
          description: Liste de mes offres

  /bids/product/{productId}:
    get:
      tags: [Offres d'enchères (Bids)]
      summary: Historique complet des offres (Vendeur/Admin)
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Liste ordonnée des offres

  /bids/{id}/status:
    patch:
      tags: [Offres d'enchères (Bids)]
      summary: Accepter ou refuser une offre (Vendeur propriétaire / Admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [ACCEPTED, REJECTED, CANCELLED]
      responses:
        "200":
          description: Statut mis à jour

  # ═══════════════════════════════════════════════════════════════════════════
  # 11. Panier (Cart)
  # ═══════════════════════════════════════════════════════════════════════════
  /cart:
    get:
      tags: [Panier]
      summary: Contenu du panier
      responses:
        "200":
          description: Panier avec totaux
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartResponse"
    delete:
      tags: [Panier]
      summary: Vider le panier
      responses:
        "200":
          description: Panier vidé

  /cart/items:
    post:
      tags: [Panier]
      summary: Ajouter un article au panier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, quantity]
              properties:
                productId:
                  type: string
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 99
                colorId:
                  type: string
                  nullable: true
                sizeId:
                  type: string
                  nullable: true
      responses:
        "201":
          description: Article ajouté

  /cart/items/{productId}:
    patch:
      tags: [Panier]
      summary: Modifier la quantité d'un article
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
        - name: colorId
          in: query
          schema:
            type: string
        - name: sizeId
          in: query
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity:
                  type: integer
                  minimum: 0
                  maximum: 99
      responses:
        "200":
          description: Quantité mise à jour
    delete:
      tags: [Panier]
      summary: Retirer un article du panier
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
        - name: colorId
          in: query
          schema:
            type: string
        - name: sizeId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Article retiré

  # ═══════════════════════════════════════════════════════════════════════════
  # 12. Favoris (Favorites)
  # ═══════════════════════════════════════════════════════════════════════════
  /favorites:
