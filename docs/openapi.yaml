# ═════════════════════════════════════════════════════════════════════════════
# COMPOSANTS & SCHÉMAS DE DONNÉES
# ═════════════════════════════════════════════════════════════════════════════
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    CookieAuth:
      type: apiKey
      in: cookie
      name: refreshToken

  responses:
    UnauthorizedError:
      description: Non authentifié ou jeton invalide
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ForbiddenError:
      description: Accès refusé
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFoundError:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: UNAUTHORIZED
            message:
              type: string
            details:
              type: object
              nullable: true

    AuthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            user:
              $ref: "#/components/schemas/User"
            accessToken:
              type: string
              description: JWT d'accès (15 min)
            needsProfileCompletion:
              type: boolean
              description: Présent uniquement après OAuth

    SitePage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        summary:
          type: string
        content:
          type: string
        showInFooter:
          type: boolean
        footerSection:
          type: string
          nullable: true
          enum: [NAVIGATION, SERVICES, INFORMATION]
        updatedAt:
          type: string
          format: date-time

    SitePageInput:
      type: object
      required: [slug, title]
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          maxLength: 80
        title:
          type: string
          minLength: 1
          maxLength: 200
        summary:
          type: string
          maxLength: 5000
        content:
          type: string
          maxLength: 50000
        published:
          type: boolean
        showInFooter:
          type: boolean
        footerSection:
          type: string
          nullable: true
          enum: [NAVIGATION, SERVICES, INFORMATION]

    SitePageUpdateInput:
      type: object
      minProperties: 1
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          maxLength: 80
        title:
          type: string
          minLength: 1
          maxLength: 200
        summary:
          type: string
          maxLength: 5000
        content:
          type: string
          maxLength: 50000
        published:
          type: boolean
        showInFooter:
          type: boolean
        footerSection:
          type: string
          nullable: true
          enum: [NAVIGATION, SERVICES, INFORMATION]

    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        fullName:
          type: string
        phone:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
          format: uri
        age:
          type: integer
          nullable: true
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER]
          nullable: true
        role:
          type: string
          enum: [CUSTOMER, SELLER, ADMIN]
        isVerified:
          type: boolean
        emailVerified:
          type: boolean
        phoneVerified:
          type: boolean
        primaryProvider:
          type: string
          enum: [LOCAL, GOOGLE, FACEBOOK]
        identityVerificationStatus:
          type: string
          enum: [NOT_SUBMITTED, PENDING, APPROVED, REJECTED, EXPIRED]
        isMinor:
          type: boolean
        createdAt:
          type: string
          format: date-time

    Address:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        fullName:
          type: string
        phone:
          type: string
        email:
          type: string
          nullable: true
        province:
          type: string
          enum: [ANTANANARIVO, ANTSIRANANA, MAHAJANGA, TOAMASINA, FIANARANTSOA, TOLIARA]
        region:
          type: string
        city:
          type: string
        neighborhood:
          type: string
          nullable: true
        address:
          type: string
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        notes:
          type: string
          nullable: true
        isDefault:
          type: boolean
        pickupPoint:
          type: object
          nullable: true
          properties:
            id:
              type: string
            name:
              type: string
            provider:
              type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AddressInput:
      type: object
      required: [label, fullName, phone, province, region, city, address]
      properties:
        label:
          type: string
          maxLength: 60
        fullName:
          type: string
          maxLength: 120
        phone:
          type: string
          example: "0341234567"
        email:
          type: string
          format: email
        province:
          type: string
          enum: [ANTANANARIVO, ANTSIRANANA, MAHAJANGA, TOAMASINA, FIANARANTSOA, TOLIARA]
        region:
          type: string
        city:
          type: string
        neighborhood:
