  # ═══════════════════════════════════════════════════════════════════════════
  # 9. Enchères (Auctions)
  # ═══════════════════════════════════════════════════════════════════════════
  /auctions:
    get:
      tags: [Enchères (Auctions)]
      summary: Lister les enchères
      security: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [SCHEDULED, ACTIVE, ENDED, CANCELLED, SOLD, UNSOLD]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 12
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [ending-soon, newest, most-bids, price-desc]
            default: ending-soon
      responses:
        "200":
          description: Liste des enchères

  /auctions/{productId}:
    get:
      tags: [Enchères (Auctions)]
      summary: Détails de l'enchère
      security: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Détails de l'enchère

  /auctions/{productId}/stats:
    get:
      tags: [Enchères (Auctions)]
      summary: Statistiques live (offres, spectateurs, messages)
      security: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Statistiques

  /auctions/{productId}/watchers/count:
    get:
      tags: [Enchères (Auctions)]
      summary: Nombre de spectateurs actifs
      security: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Compteur de spectateurs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      watcherCount:
                        type: integer

  /auctions/{productId}/messages:
    get:
      tags: [Enchères (Auctions)]
      summary: Messages du chat
      security: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Flux des messages
    post:
      tags: [Enchères (Auctions)]
      summary: Envoyer un message dans le chat
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  maxLength: 500
      responses:
        "201":
          description: Message diffusé

  /auctions/{productId}/messages/{messageId}:
    delete:
      tags: [Enchères (Auctions)]
