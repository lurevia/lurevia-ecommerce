openapi: 3.0.3
info:
  title: Lurevia E-Commerce API
  description: |
    API REST complète pour **Lurevia** — Plateforme e-commerce artisanale malgache et enchères en direct.
    
    ### Fonctionnalités principales :
    - **Authentification & Profils** : JWT (access token 15m, refresh token 30j en cookie HttpOnly), OAuth2 Google + Facebook, complétion profil post-OAuth, vérification d'identité CIN.
    - **Catalogue artisanal** : Produits, catégories hiérarchiques, recherche texte/suggestions, gestion des stocks.
    - **Enchères en direct (Auctions)** : Système d'enchères temps réel, anti-snipe 2 min, chat de salle d'enchères, suivi en direct.
    - **Paniers & Favoris** : Gestion des articles, calcul des frais de livraison, calcul récapitulatif.
    - **Commandes & Expéditions** : Cycle de commande (PENDING -> PAID -> SHIPPED -> DELIVERED), points relais (pickup points), zones tarifaires Madagascar.
    - **Paiements Mobile Money Madagascar** : MVola (Telma), Orange Money, Airtel Money avec signature HMAC-SHA256 et webhooks sécurisés.
    - **Suivi de livraison (Delivery Tracking)** : Numéro de suivi unique, journal d'événements géolocalisés.
    - **Vendeurs & Artisans** : Tableaux de bord, contrats vendeurs, règlements (settlements), virements.
    - **Cartes & Géolocalisation** : Intégration hybride SerpApi (Google Local) & OpenStreetMap (Nominatim).
    - **Administration & Export** : Gestion RBAC (CUSTOMER, SELLER, ADMIN), métriques financières, exports Excel multi-onglets.
  version: 1.0.0
  contact:
    name: Support Technique Lurevia
    email: contact@lurevia.mg
    url: https://lurevia-ecommerce.onrender.com
  license:
    name: Propriétaire - Tous droits réservés Lurevia Madagascar
servers:
  - url: http://localhost:4000/api/v1
    description: Serveur de Développement Local
  - url: https://lurevia-ecommerce.onrender.com/api/v1
    description: Serveur de Production (Render)

security:
  - BearerAuth: []

tags:
  - name: Santé & Système
  - name: Authentification
  - name: Utilisateurs & Profils
  - name: Vérification CIN
  - name: Adresses
  - name: Catégories
  - name: Produits
  - name: Avis & Notations
  - name: Enchères (Auctions)
  - name: Offres d'enchères (Bids)
  - name: Panier
  - name: Favoris
  - name: Commandes
  - name: Paiements (Mobile Money)
  - name: Suivi de livraison
  - name: Points Relais
  - name: Zones de livraison
  - name: Cartes & Lieux
  - name: Retours & Réclamations
  - name: Notifications
  - name: Messagerie
  - name: Newsletter
  - name: Espace Vendeur
  - name: Contrats Vendeurs
  - name: Règlements & Virements
  - name: Médias & Images
  - name: Administration
  - name: Paramètres
  - name: Pages du site
  - name: Export Excel

paths:
  # ═══════════════════════════════════════════════════════════════════════════
  # 1. Santé
  # ═══════════════════════════════════════════════════════════════════════════
  /health:
    get:
      tags: [Santé & Système]
      summary: État de santé du service
      security: []
      responses:
        "200":
          description: Le serveur fonctionne normalement
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ok
                      version:
                        type: string
                        example: 1.0.0
                      timestamp:
                        type: string
                        format: date-time

  # ═══════════════════════════════════════════════════════════════════════════
  # 2. Authentification
  # ═══════════════════════════════════════════════════════════════════════════
  /auth/login:
    post:
      tags: [Authentification]
      summary: Connexion par email ou téléphone + mot de passe
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier:
                  type: string
                  description: Email OU numéro malgache
                  example: client@lurevia.mg
                password:
                  type: string
                  format: password
                  example: MotDePasse123!
      responses:
        "200":
          description: Connexion réussie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /auth/oauth/callback:
    post:
      tags: [Authentification]
      summary: Inscription OU connexion via Google / Facebook
      description: |
        Route unique pour l'inscription ET la connexion sociale.
        Si `needsProfileCompletion: true`, le client doit rediriger l'utilisateur
        vers la complétion de profil (`PATCH /users/me/oauth-profile`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, token]
              properties:
                provider:
                  type: string
                  enum: [GOOGLE, FACEBOOK]
                  example: GOOGLE
                token:
                  type: string
                  description: ID token Google ou access token Facebook
                  example: eyJhbGciOiJSUzI1NiIsImtpZCI6...
      responses:
        "200":
          description: Connexion OAuth réussie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/refresh:
    post:
      tags: [Authentification]
      summary: Rafraîchir la paire de jetons JWT
      description: Utilise le refresh token fourni dans le cookie HttpOnly.
      security: []
      responses:
        "200":
          description: Nouveaux jetons émis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /auth/logout:
    post:
      tags: [Authentification]
      summary: Déconnexion utilisateur
      responses:
        "204":
          description: Déconnexion réussie (cookie supprimé)

  /auth/me:
    get:
      tags: [Authentification]
      summary: Informations du compte connecté
      responses:
        "200":
          description: Profil utilisateur courant
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"

  /auth/verification/request:
    post:
      tags: [Authentification]
      summary: Demander la vérification du compte (admin valide manuellement)
      responses:
        "201":
          description: Demande enregistrée
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      alreadyPending:
                        type: boolean
                      requestId:
                        type: string

  /auth/verification/status:
    get:
      tags: [Authentification]
      summary: Statut de vérification de l'utilisateur
      responses:
        "200":
          description: État des vérifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      isVerified:
                        type: boolean
                      request:
                        type: object
                        nullable: true
                        properties:
                          id:
                            type: string
                          status:
                            type: string
                            enum: [PENDING, APPROVED, REJECTED, USED, EXPIRED]
                          requestedAt:
                            type: string
                            format: date-time
                          reason:
                            type: string
                            nullable: true

  # ═══════════════════════════════════════════════════════════════════════════
  # 3. Utilisateurs & Profils
  # ═══════════════════════════════════════════════════════════════════════════
  /users/me:
    patch:
      tags: [Utilisateurs & Profils]
      summary: Mise à jour du profil (avatar immédiat, autres champs via demande admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
                avatarUrl:
                  type: string
                  format: uri
                  nullable: true
      responses:
        "200":
          description: Profil mis à jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
                      pendingChange:
                        type: object
                        nullable: true
                        properties:
                          id:
                            type: string
                          status:
                            type: string
                            example: PENDING

  /users/me/oauth-profile:
    patch:
      tags: [Utilisateurs & Profils]
      summary: Compléter le profil après inscription Google/Facebook
      description: |
        Obligatoire pour les comptes OAuth. Fournit téléphone, mot de passe et CIN.
        Une demande de vérification est automatiquement créée.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password, cinNumber]
              properties:
                fullName:
                  type: string
                phone:
                  type: string
                  example: "0341234567"
                password:
                  type: string
                  format: password
                  description: Min 8 caractères, 1 majuscule, 1 minuscule, 1 chiffre
                  example: MotDePasse123!
                cinNumber:
                  type: string
                  description: 12 chiffres
                  example: "101234567890"
      responses:
        "200":
          description: Profil complété, demande de vérification créée
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "409":
          description: Téléphone ou CIN déjà utilisé

  /users/me/change-password:
    post:
      tags: [Utilisateurs & Profils]
      summary: Changer le mot de passe
      description: Révoque automatiquement toutes les sessions actives.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
                  example: NouveauMotDePasse123!
      responses:
        "204":
          description: Mot de passe changé, sessions révoquées
        "401":
          description: Mot de passe actuel incorrect

  /users/me/deletion-request:
    post:
      tags: [Utilisateurs & Profils]
      summary: Demander la suppression de son compte
      description: |
        La suppression est validée manuellement par un admin
        (protection contre les piratages de compte).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 1000
      responses:
        "201":
          description: Demande enregistrée

  # ═══════════════════════════════════════════════════════════════════════════
  # 4. Vérification CIN
  # ═══════════════════════════════════════════════════════════════════════════
  /identity-verifications:
    get:
      tags: [Vérification CIN]
      summary: Lister les demandes de vérification (Admin)
      responses:
        "200":
          description: Liste des vérifications
    post:
      tags: [Vérification CIN]
      summary: Soumettre une pièce d'identité (CIN personnelle ou tuteur)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isGuardianVerification]
              properties:
                isGuardianVerification:
                  type: boolean
                  description: |
                    `false` = vérification personnelle (CIN)
                    `true` = vérification par tuteur (pour mineurs)
                documentType:
                  type: string
                  enum: [CIN, PASSPORT, DRIVER_LICENSE, RESIDENCE_PERMIT]
                documentNumber:
                  type: string
                documentUrl:
                  type: string
                  format: uri
                documentUrlBack:
                  type: string
                  format: uri
                selfieUrl:
                  type: string
                  format: uri
                cinNumber:
                  type: string
                  description: 12 chiffres
                guardianFullName:
                  type: string
                guardianCinNumber:
                  type: string
                guardianRelation:
                  type: string
                  enum: [FATHER, MOTHER, TUTOR, LEGAL_GUARDIAN, OTHER]
                guardianCinDocumentUrl:
                  type: string
                  format: uri
                guardianPhone:
                  type: string
                guardianConsentProofUrl:
                  type: string
                  format: uri
      responses:
        "201":
          description: Demande de vérification enregistrée

  /identity-verifications/me:
    get:
      tags: [Vérification CIN]
      summary: État de sa propre vérification CIN
      responses:
        "200":
          description: Statut (PENDING, APPROVED, REJECTED)

  /identity-verifications/status:
    get:
      tags: [Vérification CIN]
      summary: Résumé du statut de vérification pour l'utilisateur connecté
      responses:
        "200":
          description: Statut global

  /identity-verifications/{id}:
    delete:
      tags: [Vérification CIN]
      summary: Annuler une demande PENDING
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Demande annulée

  # ═══════════════════════════════════════════════════════════════════════════
  # 5. Adresses
  # ═══════════════════════════════════════════════════════════════════════════
  /addresses:
    get:
      tags: [Adresses]
      summary: Liste des adresses de livraison
      responses:
        "200":
          description: Adresses de l'utilisateur
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      addresses:
                        type: array
                        items:
                          $ref: "#/components/schemas/Address"
    post:
      tags: [Adresses]
      summary: Ajouter une adresse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressInput"
      responses:
        "201":
          description: Adresse créée
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      address:
                        $ref: "#/components/schemas/Address"

  /addresses/{id}:
    get:
      tags: [Adresses]
      summary: Détail d'une adresse
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Détails de l'adresse
    patch:
      tags: [Adresses]
      summary: Modifier une adresse
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressInput"
      responses:
        "200":
          description: Adresse modifiée
    delete:
      tags: [Adresses]
      summary: Supprimer une adresse
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Adresse supprimée

  /addresses/{id}/default:
    post:
      tags: [Adresses]
      summary: Définir comme adresse par défaut
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Adresse définie par défaut

  # ═══════════════════════════════════════════════════════════════════════════
  # 6. Catégories
  # ═══════════════════════════════════════════════════════════════════════════
  /categories:
    get:
      tags: [Catégories]
      summary: Lister les catégories
      security: []
      responses:
        "200":
          description: Liste des catégories
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      categories:
                        type: array
                        items:
                          $ref: "#/components/schemas/Category"
    post:
      tags: [Catégories]
      summary: Créer une catégorie (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, description, imageUrl, bannerUrl]
              properties:
                name:
                  type: string
                description:
                  type: string
                imageUrl:
                  type: string
                  format: uri
                bannerUrl:
                  type: string
                  format: uri
                iconName:
                  type: string
                  default: ShoppingBag
                position:
                  type: integer
                  default: 0
      responses:
        "201":
          description: Catégorie créée

  /categories/reorder:
    patch:
      tags: [Catégories]
      summary: Réordonner les catégories (Admin, drag & drop)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [id, position]
                    properties:
                      id:
                        type: string
                      position:
                        type: integer
                        minimum: 0
      responses:
        "200":
          description: Catégories réordonnées

  /categories/slug/{slug}:
    get:
      tags: [Catégories]
      summary: Obtenir une catégorie par slug
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Détails de la catégorie

  /categories/id/{id}:
    get:
      tags: [Catégories]
      summary: Obtenir une catégorie par ID (Admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Catégorie trouvée

  /categories/{id}:
    patch:
      tags: [Catégories]
      summary: Modifier une catégorie (Admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Catégorie modifiée
    delete:
      tags: [Catégories]
      summary: Supprimer une catégorie (Admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Catégorie supprimée

  # ═══════════════════════════════════════════════════════════════════════════
  # 7. Produits
  # ═══════════════════════════════════════════════════════════════════════════
  /products:
    get:
      tags: [Produits]
      summary: Rechercher et filtrer les produits
      security: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 12
            maximum: 100
        - name: search
          in: query
          schema:
            type: string
        - name: categories
          in: query
          schema:
            type: string
            description: Slugs séparés par virgules
        - name: categoryId
          in: query
          schema:
            type: string
        - name: priceMin
          in: query
          schema:
            type: integer
        - name: priceMax
          in: query
          schema:
            type: integer
        - name: pricingMode
          in: query
          schema:
            type: string
            enum: [FIXED, NEGOTIABLE, AUCTION, ON_REQUEST]
        - name: availability
          in: query
          schema:
            type: string
            enum: [all, in-stock, out-of-stock]
            default: all
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [newest, price-asc, price-desc, rating-desc, popular]
            default: newest
      responses:
        "200":
          description: Liste paginée de produits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedProducts"
    post:
      tags: [Produits]
      summary: Créer un produit (Vendeur Vérifié / Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Produit créé

  /products/search/suggestions:
    get:
      tags: [Produits]
      summary: Suggestions d'autocomplétion
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 6
            maximum: 20
      responses:
        "200":
          description: Suggestions

  /products/slug/{slug}:
    get:
      tags: [Produits]
      summary: Obtenir un produit par slug
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Fiche produit
        "404":
          $ref: "#/components/responses/NotFoundError"

  /products/{id}:
    get:
      tags: [Produits]
      summary: Obtenir un produit par ID
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Fiche produit
    patch:
      tags: [Produits]
      summary: Mettre à jour un produit (propriétaire / Admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: Produit mis à jour
    delete:
      tags: [Produits]
      summary: Supprimer un produit (propriétaire / Admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Produit supprimé

  /products/{id}/related:
    get:
      tags: [Produits]
      summary: Produits liés
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 4
      responses:
        "200":
          description: Produits associés

  /products/seller/mine:
    get:
      tags: [Produits]
      summary: Produits du vendeur connecté
      responses:
        "200":
          description: Liste des produits

  # ═══════════════════════════════════════════════════════════════════════════
  # 8. Avis & Notations
  # ═══════════════════════════════════════════════════════════════════════════
  /products/{productId}/reviews:
    get:
      tags: [Avis & Notations]
      summary: Lister les avis sur un produit
      security: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Liste des avis vérifiés
    post:
      tags: [Avis & Notations]
      summary: Publier un avis après commande livrée
      description: Nécessite un achat vérifié et 5 jours après livraison.
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating, comment]
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                title:
                  type: string
                  maxLength: 120
                comment:
                  type: string
                  maxLength: 2000
      responses:
        "201":
          description: Avis publié

  /products/{productId}/reviews/rating:
    get:
      tags: [Avis & Notations]
      summary: Distribution des notes
      security: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Moyenne + distribution

  /products/{productId}/reviews/eligibility:
    get:
      tags: [Avis & Notations]
