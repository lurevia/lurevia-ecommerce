  # ═══════════════════════════════════════════════════════════════════════════
  # 19. Retours & Réclamations (Feedback)
  # ═══════════════════════════════════════════════════════════════════════════
  /feedback:
    get:
      tags: [Retours & Réclamations]
      summary: Liste des retours (public filtré)
      security: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Liste des feedbacks
    post:
      tags: [Retours & Réclamations]
      summary: Soumettre un ticket
      requestBody:
        required: true
