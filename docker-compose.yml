services:
  postgres:
    image: postgres:16-alpine
    container_name: lurevia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lurevia
      POSTGRES_PASSWORD: lurevia_password
      POSTGRES_DB: lurevia
    ports:
      - "5432:5432"
    volumes:
      - lurevia_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lurevia -d lurevia"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lurevia-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql://lurevia:lurevia_password@postgres:5432/lurevia?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?erreur - définissez JWT_ACCESS_SECRET dans .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?erreur - définissez JWT_REFRESH_SECRET dans .env}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 300
      AUTH_RATE_LIMIT_MAX: 10
      LOG_LEVEL: info
      DEFAULT_SHIPPING_COST: 8000
      FREE_SHIPPING_THRESHOLD: 250000
      REVIEW_DELAY_DAYS: 5
    ports:
      - "4000:4000"
    # `migrate deploy` applique l'historique de migrations s'il existe déjà
    # (flux normal une fois `prisma migrate dev` lancé au moins une fois en
    # local et les migrations commitées) ; à défaut (tout premier démarrage
    # sans dossier prisma/migrations), on retombe sur `db push` pour créer
    # le schéma directement — pratique pour une première mise en route rapide.
    command: sh -c "npx prisma migrate deploy || npx prisma db push --accept-data-loss && node dist/server.js"

volumes:
  lurevia_postgres_data:
