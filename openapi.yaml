            schema:
              type: object
              required: [recipientId, initialMessage]
              properties:
                recipientId:
                  type: string
                initialMessage:
                  type: string
      responses:
        "201":
          description: Conversation initialisée

  /messages/conversations/{id}/messages:
    get:
      tags: [Messagerie]
      summary: Messages d'une conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Liste des messages
    post:
      tags: [Messagerie]
      summary: Envoyer un message dans la conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
      responses:
        "201":
          description: Message envoyé

  # ═══════════════════════════════════════════════════════════════════════════
  # 22. Newsletter
  # ═══════════════════════════════════════════════════════════════════════════
  /newsletter/subscribe:
    post:
      tags: [Newsletter]
      summary: S'abonner aux lettres d'information Lurevia
