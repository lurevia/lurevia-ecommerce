      responses:
        "200":
          description: Inscription confirmée

  /newsletter/unsubscribe:
    post:
      tags: [Newsletter]
      summary: Se désabonner de la newsletter
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Désabonnement effectué

  # ═══════════════════════════════════════════════════════════════════════════
  # 23. Espace Vendeur
  # ═══════════════════════════════════════════════════════════════════════════
  /seller/dashboard:
    get:
      tags: [Espace Vendeur]
      summary: Métriques et indicateurs de performance de la boutique
      responses:
        "200":
          description: Chiffre d'affaires, commandes en attente, articles populaires

  /seller/products:
    get:
      tags: [Espace Vendeur]
      summary: Gestion des stocks et produits du vendeur
      responses:
        "200":
          description: Produits de la boutique

  /seller/orders:
    get:
      tags: [Espace Vendeur]
      summary: Commandes passées auprès de la boutique
      responses:
        "200":
          description: Commandes à préparer et expédier

  # ═══════════════════════════════════════════════════════════════════════════
  # 24. Contrats Vendeurs
  # ═══════════════════════════════════════════════════════════════════════════
  /seller-contracts:
    get:
      tags: [Contrats Vendeurs]
      summary: Obtenir les contrats de partenariat vendeur
      responses:
        "200":
          description: Liste des contrats
    post:
      tags: [Contrats Vendeurs]
      summary: Générer un contrat vendeur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commissionRate]
              properties:
                commissionRate:
                  type: number
                  example: 0.12
      responses:
        "201":
          description: Contrat généré

  /seller-contracts/{id}/sign:
    post:
      tags: [Contrats Vendeurs]
      summary: Signer électroniquement un contrat vendeur
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signatureText]
              properties:
                signatureText:
                  type: string
                  example: "Lu et approuvé - Artisan Rakoto"
      responses:
        "200":
          description: Contrat signé avec succès

  # ═══════════════════════════════════════════════════════════════════════════
  # 25. Règlements & Virements
  # ═══════════════════════════════════════════════════════════════════════════
  /settlements:
    get:
      tags: [Règlements & Virements]
      summary: Historique des règlements financiers des ventes
      responses:
        "200":
          description: Liste des règlements

  /settlements/generate:
    post:
      tags: [Règlements & Virements]
      summary: Calculer et générer les règlements de la période (Admin)
      responses:
        "201":
          description: Règlements générés

  /transfers:
    get:
      tags: [Règlements & Virements]
      summary: Historique des transferts d'argent vers les artisans
      responses:
        "200":
          description: Liste des virements
    post:
      tags: [Règlements & Virements]
      summary: Émettre un virement bancaire ou Mobile Money (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sellerId, amount, method, destinationAccount]
              properties:
                sellerId:
                  type: string
                amount:
                  type: integer
                  example: 450000
                method:
                  type: string
                  enum: [MVOLA, ORANGE_MONEY, AIRTEL_MONEY, BANK_TRANSFER]
                destinationAccount:
                  type: string
                  example: "0341234567"
      responses:
        "201":
          description: Transfert enregistré

  # ═══════════════════════════════════════════════════════════════════════════
  # 26. Médias & Images
  # ═══════════════════════════════════════════════════════════════════════════
  /media/upload:
    post:
      tags: [Médias & Images]
      summary: Téléverser une image (base64 ou multipart)
      description: Permet d'héberger les photos de produits, avatars et pièces CIN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file, filename]
              properties:
                file:
                  type: string
                  description: Fichier encodé en base64
                filename:
                  type: string
                  example: photo-panier.jpg
                folder:
                  type: string
                  default: products
      responses:
        "201":
          description: Image téléversée
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        format: uri
                        example: "https://media.lurevia.mg/products/photo-panier.jpg"

  # ═══════════════════════════════════════════════════════════════════════════
  # 27. Administration
  # ═══════════════════════════════════════════════════════════════════════════
  /admin/dashboard:
    get:
      tags: [Administration]
      summary: Tableau de bord global et statistiques clés de Lurevia (Admin)
      responses:
        "200":
          description: Métriques de vente, utilisateurs, commandes et volume d'enchères

  /admin/users:
    get:
      tags: [Administration]
      summary: Liste complète des utilisateurs et filtrage des rôles (Admin)
      responses:
        "200":
          description: Utilisateurs inscrits

  /admin/users/{id}/role:
    patch:
      tags: [Administration]
      summary: Modifier le rôle d'un utilisateur (BUYER, SELLER, ADMIN)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [BUYER, SELLER, ADMIN, SUPER_ADMIN]
      responses:
        "200":
          description: Rôle modifié

  /admin/sellers:
    get:
      tags: [Administration]
      summary: Liste des vendeurs et statut de vérification (Admin)
      responses:
        "200":
          description: Vendeurs partenaires

  /admin/sellers/{id}/status:
    patch:
      tags: [Administration]
      summary: Approuver, suspendre ou réactiver une boutique vendeuse (Admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [PENDING, ACTIVE, SUSPENDED]
      responses:
        "200":
          description: Statut vendeur mis à jour

  # ═══════════════════════════════════════════════════════════════════════════
  # 28. Paramètres de plateforme
  # ═══════════════════════════════════════════════════════════════════════════
  /settings:
    get:
      tags: [Paramètres]
      summary: Obtenir les paramètres globaux (frais de port par défaut, seuil franco)
      security: []
      responses:
        "200":
          description: Paramètres système
    put:
      tags: [Paramètres]
      summary: Mettre à jour les paramètres globaux (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                defaultShippingCost:
                  type: integer
                  example: 8000
                freeShippingThreshold:
                  type: integer
                  example: 250000
      responses:
        "200":
          description: Paramètres enregistrés

  # ═══════════════════════════════════════════════════════════════════════════
  # 29. Export Excel
  # ═══════════════════════════════════════════════════════════════════════════
  /export/orders:
    get:
      tags: [Export Excel]
      summary: Exporter toutes les commandes au format Excel .xlsx (Admin / Vendeur)
      responses:
        "200":
          description: Fichier Excel téléchargé
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /export/profile:
    get:
      tags: [Export Excel]
      summary: Exporter ses données personnelles au format Excel (RGPD)
      responses:
        "200":
          description: Fichier Excel des données de compte
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /export/activity:
    get:
      tags: [Export Excel]
      summary: Exporter l'historique d'activité de la boutique (Vendeur)
      responses:
        "200":
          description: Fichier Excel d'activité
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

# ═════════════════════════════════════════════════════════════════════════════
# COMPOSANTS & SCHÉMAS DE DONNÉES
# ═════════════════════════════════════════════════════════════════════════════
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Insérer le jeton JWT d'accès reçu après connexion (`/auth/login`).
        Exemple : `Bearer eyJhbGciOi...`
    CookieAuth:
      type: apiKey
      in: cookie
      name: refreshToken
      description: Cookie HttpOnly contenant le refresh token.

  responses:
    UnauthorizedError:
      description: Non authentifié ou jeton JWT invalide / expiré
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ForbiddenError:
      description: Accès refusé - permissions insuffisantes
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFoundError:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: UNAUTHORIZED
            message:
              type: string
              example: Jeton d'accès invalide ou expiré.
            statusCode:
              type: integer
              example: 401

    SuccessMessage:
      type: object
      properties:
        data:
          type: object
          properties:
            message:
              type: string
              example: Opération effectuée avec succès

    AuthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            user:
              $ref: "#/components/schemas/User"
            tokens:
              $ref: "#/components/schemas/TokensResponse"

    TokensResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        expiresIn:
          type: string
          example: 15m

    User:
      type: object
      properties:
        id:
          type: string
          example: usr_clz9823abc
        email:
          type: string
          format: email
          example: client@lurevia.mg
        fullName:
          type: string
          example: Faly Rakotondrabe
        phone:
          type: string
          nullable: true
          example: "0341234567"
        avatarUrl:
          type: string
          nullable: true
          format: uri
        role:
          type: string
          enum: [BUYER, SELLER, ADMIN, SUPER_ADMIN]
          example: BUYER
        isVerified:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time

    UserProfile:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            bio:
              type: string
              nullable: true
            city:
              type: string
              nullable: true
              example: Antananarivo
            province:
              type: string
              nullable: true
              example: Analamanga

    PublicUser:
      type: object
      properties:
        id:
          type: string
        fullName:
          type: string
        avatarUrl:
          type: string
          nullable: true
        role:
          type: string
        bio:
          type: string
          nullable: true

    Address:
      type: object
      properties:
        id:
          type: string
        fullName:
          type: string
        phone:
          type: string
        addressLine1:
          type: string
        addressLine2:
          type: string
          nullable: true
        city:
          type: string
        region:
          type: string
        postalCode:
          type: string
          nullable: true
        isDefault:
          type: boolean

    AddressInput:
      type: object
      required: [fullName, phone, addressLine1, city, region]
      properties:
        fullName:
          type: string
          example: Faly Rakotondrabe
        phone:
          type: string
          example: "0341234567"
        addressLine1:
          type: string
          example: Lot IVC 42bis Antanimena
        addressLine2:
          type: string
          nullable: true
        city:
          type: string
          example: Antananarivo
        region:
          type: string
          example: Analamanga
        postalCode:
          type: string
          example: "101"
        isDefault:
          type: boolean
          default: false

    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
        parentId:
          type: string
          nullable: true
        children:
          type: array
          items:
            $ref: "#/components/schemas/Category"

    Product:
      type: object
      properties:
        id:
          type: string
          example: prd_clz9823abc
        title:
          type: string
          example: "Panier artisanal en raphia tressé à la main"
        slug:
          type: string
          example: panier-artisanal-en-raphia-tresse
        description:
          type: string
          example: "Fabriqué traditionnellement par nos artisans vanniers d'Antsirabe."
        price:
          type: integer
          description: Prix en Ariary (MGA)
          example: 45000
        compareAtPrice:
          type: integer
          nullable: true
          example: 55000
        stock:
          type: integer
          example: 15
        isHandmade:
          type: boolean
          example: true
        originRegion:
          type: string
          example: Vakinankaratra
        images:
          type: array
          items:
            type: string
            format: uri
        category:
          $ref: "#/components/schemas/Category"
        seller:
          $ref: "#/components/schemas/PublicUser"
        ratingAvg:
          type: number
          example: 4.8
        ratingCount:
          type: integer
          example: 12

    ProductInput:
      type: object
      required: [title, description, price, stock, categoryId]
      properties:
        title:
          type: string
          example: "Sac rond en raphia et cuir d'artisan"
        description:
          type: string
          example: "Tressé avec du raphia 100% naturel de Madagascar, anses en cuir véritable."
        price:
          type: integer
          example: 65000
        compareAtPrice:
          type: integer
          nullable: true
        stock:
          type: integer
          example: 10
        categoryId:
          type: string
        isHandmade:
          type: boolean
          default: true
        originRegion:
          type: string
          example: Analamanga
        images:
          type: array
          items:
            type: string
            format: uri

    PaginatedProducts:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        meta:
          type: object
          properties:
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 20
            total:
              type: integer
              example: 145
            totalPages:
              type: integer
              example: 8

    Auction:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        product:
          $ref: "#/components/schemas/Product"
        startPrice:
          type: integer
          example: 50000
        currentPrice:
          type: integer
          example: 95000
        reservePrice:
          type: integer
          nullable: true
        minIncrement:
          type: integer
          example: 5000
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        status:
          type: string
          enum: [PENDING, ACTIVE, ENDED, CANCELLED]
          example: ACTIVE
        bidsCount:
          type: integer
          example: 8
        watchersCount:
          type: integer
          example: 24

    Bid:
      type: object
      properties:
        id:
          type: string
        auctionId:
          type: string
        bidderId:
          type: string
        amount:
          type: integer
          example: 100000
        createdAt:
          type: string
          format: date-time
        bidder:
          type: object
          properties:
            fullName:
              type: string
            avatarUrl:
              type: string
              nullable: true

    CartResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  productId:
                    type: string
                  quantity:
                    type: integer
                  product:
                    $ref: "#/components/schemas/Product"
            subtotal:
              type: integer
              example: 110000
            shippingCost:
              type: integer
              example: 8000
            total:
              type: integer
              example: 118000

    Order:
      type: object
      properties:
        id:
          type: string
          example: ord_clz9823abc
        orderNumber:
          type: string
          example: LV-2026-0042
        status:
          type: string
          enum: [PENDING, PAID, PROCESSING, SHIPPED, DELIVERED, CANCELLED]
          example: PAID
        totalAmount:
          type: integer
          example: 118000
        subtotalAmount:
          type: integer
          example: 110000
        shippingAmount:
          type: integer
          example: 8000
        shippingAddress:
          $ref: "#/components/schemas/Address"
        paymentProvider:
          type: string
          enum: [MVOLA, ORANGE_MONEY, AIRTEL_MONEY]
          nullable: true
          example: MVOLA
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              productId:
                type: string
              title:
                type: string
              quantity:
                type: integer
              unitPrice:
                type: integer
        createdAt:
          type: string
          format: date-time

    CreateOrderInput:
      type: object
      required: [addressId]
      properties:
        addressId:
          type: string
        pickupPointId:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true

    PaymentTransaction:
      type: object
      properties:
        id:
          type: string
          example: tx_clz9823abc
        orderId:
          type: string
        provider:
          type: string
          enum: [MVOLA, ORANGE_MONEY, AIRTEL_MONEY]
          example: MVOLA
        phoneNumber:
          type: string
          example: "0341234567"
        amount:
          type: integer
          example: 118000
        currency:
          type: string
          example: MGA
        status:
          type: string
          enum: [INITIATED, SUCCESS, FAILED, REFUNDED]
          example: SUCCESS
        externalTransactionId:
          type: string
          nullable: true
          example: "MV-98213-TX"
        createdAt:
          type: string
          format: date-time

    PickupPoint:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          example: "Relais Express Analakely"
        address:
          type: string
          example: "Avenue de l'Indépendance, Antananarivo"
        city:
          type: string
          example: Antananarivo
        phone:
          type: string
          example: "0340011223"
        openingHours:
          type: string
          example: "Lun-Sam: 08h00 - 18h00"

    PickupPointInput:
      type: object
      required: [name, address, city, phone]
      properties:
        name:
          type: string
        address:
          type: string
        city:
          type: string
        phone:
          type: string
        openingHours:
          type: string

    PlaceResult:
      type: object
      properties:
        title:
          type: string
          example: "Analakely, Antananarivo"
        address:
          type: string
          example: "Analakely, Antananarivo, Analamanga, Madagascar"
        latitude:
          type: number
          example: -18.9083
        longitude:
          type: number
          example: 47.5244
        phone:
          type: string
          nullable: true
        provider:
          type: string
          enum: [serpapi, openstreetmap, fallback]
          example: openstreetmap
