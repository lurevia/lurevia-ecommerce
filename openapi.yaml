openapi: 3.0.3
info:
  title: Lurevia E-Commerce API
  description: |
    API REST complète pour **Lurevia** — Plateforme e-commerce artisanale malgache et enchères en direct.
    
    ### Fonctionnalités principales :
    - **Authentification & Profils** : JWT (access token 15m, refresh token 30j), OAuth2 Google, vérification d'identité CIN.
    - **Catalogue artisanal** : Produits, catégories hiérarchiques, recherche texte/suggestions, gestion des stocks.
    - **Enchères en direct (Auctions)** : Système d'enchères temps réel, anti-snipe 2 min, chat de salle d'enchères, suivi en direct.
    - **Paniers & Favoris** : Gestion des articles, calcul des frais de livraison, calcul récapitulatif.
    - **Commandes & Expéditions** : Cycle de commande (PENDING -> PAID -> PROCESSING -> SHIPPED -> DELIVERED), points relais (pickup points), zones tarifaires Madagascar.
    - **Paiements Mobile Money Madagascar** : MVola (Telma), Orange Money, Airtel Money avec signature HMAC-SHA256 et webhooks sécurisés.
    - **Suivi de livraison (Delivery Tracking)** : Numéro de suivi unique, journal d'événements géolocalisés, mise à jour de statut.
    - **Vendeurs & Artisans** : Tableaux de bord, contrats vendeurs (signature électronique), règlements (settlements), virements bancaires/mobile money.
    - **Cartes & Géolocalisation** : Intégration hybride SerpApi (Google Local) & OpenStreetMap (Nominatim) sans clé obligatoire.
    - **Administration & Export** : Gestion RBAC (BUYER, SELLER, ADMIN, SUPER_ADMIN), métriques financières, exports Excel multi-onglets.
  version: 1.0.0
  contact:
    name: Support Technique Lurevia
    email: contact@lurevia.mg
    url: https://lurevia-ecommerce.onrender.com
  license:
    name: Propriétaire - Tous droits réservés Lurevia Madagascar
servers:
  - url: http://localhost:3000/api/v1
    description: Serveur de Développement Local
  - url: https://lurevia-ecommerce.onrender.com/api/v1
    description: Serveur de Production (Render)

security:
  - BearerAuth: []

tags:
  - name: Santé & Système
    description: Surveillance et état de santé du serveur
  - name: Authentification
    description: Connexion, inscription, refresh tokens, Google OAuth et vérification d'identité
  - name: Utilisateurs & Profils
    description: Gestion des comptes utilisateurs, profils, avatars et coordonnées
  - name: Vérification CIN
    description: Soumission et validation des cartes d'identité nationales
  - name: Adresses
    description: Carnet d'adresses de livraison et facturation à Madagascar
  - name: Catégories
    description: Arborescence des catégories de produits artisanaux
  - name: Produits
    description: Catalogue de produits, recherche, filtres et gestion artisanale
  - name: Avis & Notations
    description: Avis vérifiés sur les produits et votes d'utilité
  - name: Enchères (Auctions)
    description: Système d'enchères artisanales en temps réel
  - name: Offres d'enchères (Bids)
    description: Placement et historique des offres d'enchères
  - name: Panier
    description: Gestion du panier d'achat et validation
  - name: Favoris
    description: Liste d'envies et articles favoris
  - name: Commandes
    description: Création, suivi d'état et annulation de commandes
  - name: Paiements (Mobile Money)
    description: MVola, Orange Money, Airtel Money et webhooks opérateurs
  - name: Suivi de livraison
    description: Suivi des colis en temps réel et événements d'expédition
  - name: Points Relais
    description: Réseau de points de collecte à Madagascar
  - name: Zones de livraison
    description: Tarifs et zones d'expédition régionales
  - name: Cartes & Lieux
    description: Recherche de lieux et géolocalisation (SerpApi & OpenStreetMap)
  - name: Retours & Réclamations
    description: Retours clients, réclamations et feedback
  - name: Notifications
    description: Notifications in-app pour acheteurs et vendeurs
  - name: Messagerie
    description: Messagerie directe acheteur-vendeur
  - name: Newsletter
    description: Inscriptions et désabonnements aux actualités
  - name: Espace Vendeur
    description: Tableau de bord, ventes et métriques vendeurs
  - name: Contrats Vendeurs
    description: Gestion et signature électronique des contrats artisans
  - name: Règlements & Virements
    description: Règlements financiers (settlements) et virements bancaires/mobile money
  - name: Médias & Images
    description: Téléversement et gestion d'images
  - name: Administration
    description: Modération, gestion des utilisateurs, statistiques globales
  - name: Paramètres
    description: Configuration de la plateforme
  - name: Export Excel
    description: Exportation de données administratives et comptables

paths:
  # ═══════════════════════════════════════════════════════════════════════════
  # 1. Santé
  # ═══════════════════════════════════════════════════════════════════════════
  /health:
    get:
      tags: [Santé & Système]
      summary: État de santé du service
      description: Vérification de l'état du serveur backend pour monitoring et sondes de santé.
      security: []
      responses:
        "200":
          description: Le serveur fonctionne normalement
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ok
                      version:
                        type: string
                        example: 1.0.0
                      timestamp:
                        type: string
                        format: date-time
                        example: "2026-09-29T12:00:00.000Z"

  # ═══════════════════════════════════════════════════════════════════════════
  # 2. Authentification
  # ═══════════════════════════════════════════════════════════════════════════
  /auth/login:
    post:
      tags: [Authentification]
      summary: Connexion par identifiant (Email ou Téléphone) et mot de passe
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier:
                  type: string
                  description: Adresse email ou numéro de téléphone malgache (ex 0341234567)
                  example: client@lurevia.mg
                password:
                  type: string
                  format: password
                  example: MotDePasseSecurise123!
      responses:
        "200":
          description: Connexion réussie, tokens retournés
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /auth/oauth/callback:
    post:
      tags: [Authentification]
      summary: Authentification sociale via Google OAuth2
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, idToken]
              properties:
                provider:
                  type: string
                  enum: [google]
                  example: google
                idToken:
                  type: string
                  description: Token d'identité Google JWT
                  example: eyJhbGciOiJSUzI1NiIsImtpZCI6...
      responses:
        "200":
          description: Connexion Google réussie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/refresh:
    post:
      tags: [Authentification]
      summary: Rafraîchir la paire de jetons JWT
      security: []
      description: Utilise le refresh token fourni dans le body ou le cookie HttpOnly.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Nouveaux jetons émis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokensResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /auth/logout:
    post:
      tags: [Authentification]
      summary: Déconnexion utilisateur
      description: Invalide le refresh token et supprime les cookies de session.
      responses:
        "200":
          description: Déconnexion réussie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"

  /auth/me:
    get:
      tags: [Authentification]
      summary: Informations du compte connecté
      responses:
        "200":
          description: Données du compte utilisateur actuel
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /auth/verification/request:
    post:
      tags: [Authentification]
      summary: Demander la vérification de téléphone ou d'email (envoi code OTP)
      responses:
        "200":
          description: Demande envoyée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"

  /auth/verification/status:
    get:
      tags: [Authentification]
      summary: Statut de vérification de l'utilisateur
      responses:
        "200":
          description: État des vérifications (téléphone, email, identité)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      emailVerified:
                        type: boolean
                      phoneVerified:
                        type: boolean
                      identityVerified:
                        type: boolean

  # ═══════════════════════════════════════════════════════════════════════════
  # 3. Utilisateurs & Profils
  # ═══════════════════════════════════════════════════════════════════════════
  /users/me:
    get:
      tags: [Utilisateurs & Profils]
      summary: Profil complet de l'utilisateur connecté
      responses:
        "200":
          description: Profil utilisateur
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/UserProfile"
    patch:
      tags: [Utilisateurs & Profils]
      summary: Mise à jour du profil (nom, téléphone, bio, préférences)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                phone:
                  type: string
                bio:
                  type: string
                city:
                  type: string
                province:
                  type: string
      responses:
        "200":
          description: Profil mis à jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/UserProfile"

  /users/me/avatar:
    patch:
      tags: [Utilisateurs & Profils]
      summary: Changer la photo de profil (avatar)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [avatarUrl]
              properties:
                avatarUrl:
                  type: string
                  format: uri
      responses:
        "200":
          description: Avatar mis à jour avec succès

  /users/{id}:
    get:
      tags: [Utilisateurs & Profils]
      summary: Profil public d'un artisan ou utilisateur
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Profil public
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PublicUser"
        "404":
          $ref: "#/components/responses/NotFoundError"

  # ═══════════════════════════════════════════════════════════════════════════
  # 4. Vérification CIN
  # ═══════════════════════════════════════════════════════════════════════════
  /identity-verifications:
    get:
      tags: [Vérification CIN]
      summary: Lister toutes les demandes de vérification (Admin)
      responses:
        "200":
          description: Liste des vérifications
    post:
      tags: [Vérification CIN]
      summary: Soumettre une pièce d'identité malgache (CIN / Passeport)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cinNumber, cinFrontUrl, cinBackUrl]
              properties:
                cinNumber:
                  type: string
                  example: "101234567890"
                cinIssueDate:
                  type: string
                  format: date
                cinIssuePlace:
                  type: string
                  example: Antananarivo
                cinFrontUrl:
                  type: string
                  format: uri
                cinBackUrl:
                  type: string
                  format: uri
      responses:
        "201":
          description: Demande de vérification enregistrée

  /identity-verifications/me:
    get:
      tags: [Vérification CIN]
      summary: Obtenir l'état de sa propre vérification CIN
      responses:
        "200":
          description: Statut de la vérification (PENDING, APPROVED, REJECTED)

  /identity-verifications/{id}/status:
    patch:
      tags: [Vérification CIN]
      summary: Approuver ou rejeter une vérification CIN (Admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [APPROVED, REJECTED]
                rejectionReason:
                  type: string
      responses:
        "200":
          description: Statut mis à jour

  # ═══════════════════════════════════════════════════════════════════════════
  # 5. Adresses
  # ═══════════════════════════════════════════════════════════════════════════
  /addresses:
    get:
      tags: [Adresses]
      summary: Obtenir les adresses de livraison enregistrées
      responses:
        "200":
          description: Liste des adresses de l'utilisateur
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Address"
    post:
      tags: [Adresses]
      summary: Ajouter une nouvelle adresse de livraison à Madagascar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressInput"
      responses:
        "201":
          description: Adresse créée
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Address"

  /addresses/{id}:
    get:
      tags: [Adresses]
      summary: Détail d'une adresse
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Détails de l'adresse
    patch:
      tags: [Adresses]
      summary: Modifier une adresse
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressInput"
      responses:
        "200":
          description: Adresse modifiée
    delete:
      tags: [Adresses]
      summary: Supprimer une adresse
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Adresse supprimée

  /addresses/{id}/set-default:
    patch:
      tags: [Adresses]
      summary: Définir comme adresse principale par défaut
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Adresse définie par défaut

  # ═══════════════════════════════════════════════════════════════════════════
  # 6. Catégories
  # ═══════════════════════════════════════════════════════════════════════════
  /categories:
    get:
      tags: [Catégories]
      summary: Lister toutes les catégories artisanales
      security: []
      responses:
        "200":
          description: Arborescence des catégories
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Category"
    post:
      tags: [Catégories]
      summary: Créer une catégorie (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: Vannerie & Raphia
                description:
                  type: string
                parentId:
                  type: string
                  nullable: true
                imageUrl:
                  type: string
                  format: uri
      responses:
        "201":
          description: Catégorie créée

  /categories/slug/{slug}:
    get:
      tags: [Catégories]
      summary: Obtenir une catégorie par son slug
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
          example: vannerie-raphia
      responses:
        "200":
          description: Détails de la catégorie

  /categories/{id}:
    get:
      tags: [Catégories]
      summary: Détails d'une catégorie par ID
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Catégorie trouvée
    patch:
      tags: [Catégories]
      summary: Modifier une catégorie (Admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Catégorie modifiée
    delete:
      tags: [Catégories]
      summary: Supprimer une catégorie (Admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Catégorie supprimée

  # ═══════════════════════════════════════════════════════════════════════════
  # 7. Produits
  # ═══════════════════════════════════════════════════════════════════════════
  /products:
    get:
      tags: [Produits]
      summary: Rechercher et filtrer les produits du catalogue
      security: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: string
          description: Recherche texte sur le titre ou la description
        - name: categoryId
          in: query
          schema:
            type: string
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [createdAt_desc, price_asc, price_desc, rating_desc, popular]
        - name: isHandmade
          in: query
          schema:
            type: boolean
        - name: originRegion
          in: query
          schema:
            type: string
          description: Région d'origine (ex Analamanga, Atsinanana)
      responses:
        "200":
          description: Liste paginée de produits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedProducts"
    post:
      tags: [Produits]
      summary: Créer un nouveau produit artisanal (Vendeur / Artisan)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Produit créé avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Product"

  /products/search/suggestions:
    get:
      tags: [Produits]
      summary: Suggestions d'autocomplétion pour la barre de recherche
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          example: panier
      responses:
        "200":
          description: Mots-clés et produits suggérés

  /products/slug/{slug}:
    get:
      tags: [Produits]
      summary: Obtenir un produit par son identifiant textuel (slug)
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
          example: panier-en-raphia-tresse-main
      responses:
        "200":
          description: Fiche produit complète
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /products/{id}:
    get:
      tags: [Produits]
      summary: Obtenir un produit par son ID
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Fiche produit trouvée
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Product"
    patch:
      tags: [Produits]
      summary: Mettre à jour un produit existant (Vendeur propriétaire ou Admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: Produit mis à jour
    delete:
      tags: [Produits]
      summary: Supprimer un produit (Vendeur propriétaire ou Admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Produit supprimé

  /products/{id}/related:
    get:
      tags: [Produits]
      summary: Produits similaires ou recommandés
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Liste de produits associés

  /products/seller/mine:
    get:
      tags: [Produits]
      summary: Lister les produits de l'artisan connecté
      responses:
        "200":
          description: Produits de l'artisan

  # ═══════════════════════════════════════════════════════════════════════════
  # 8. Avis & Notations
  # ═══════════════════════════════════════════════════════════════════════════
  /products/{productId}/reviews:
    get:
      tags: [Avis & Notations]
      summary: Lister les avis clients sur un produit
      security: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Liste des avis vérifiés
    post:
      tags: [Avis & Notations]
      summary: Publier un avis après commande livrée
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating, comment]
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                  example: 5
                title:
                  type: string
                  example: Qualité magnifique
                comment:
                  type: string
                  example: Le tressage est d'une grande finesse, livraison rapide à Tana.
                photos:
                  type: array
                  items:
                    type: string
                    format: uri
      responses:
        "201":
          description: Avis publié

  /reviews/{id}/vote:
    post:
      tags: [Avis & Notations]
      summary: Voter pour indiquer si un avis est utile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isHelpful]
              properties:
                isHelpful:
                  type: boolean
      responses:
        "200":
          description: Vote enregistré

  # ═══════════════════════════════════════════════════════════════════════════
  # 9. Enchères (Auctions)
  # ═══════════════════════════════════════════════════════════════════════════
  /auctions:
    get:
      tags: [Enchères (Auctions)]
      summary: Lister toutes les enchères actives ou à venir
      security: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, ACTIVE, ENDED, CANCELLED]
      responses:
        "200":
          description: Liste des enchères
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Auction"

  /auctions/{productId}:
    get:
      tags: [Enchères (Auctions)]
      summary: Détails de l'enchère liée à un produit
      security: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Détails de l'enchère
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Auction"

  /auctions/{productId}/stats:
    get:
      tags: [Enchères (Auctions)]
      summary: Statistiques de l'enchère (offre la plus haute, nombre d'enchérisseurs)
      security: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Statistiques d'enchère

  /auctions/{productId}/messages:
    get:
      tags: [Enchères (Auctions)]
      summary: Messages du tchat public de l'enchère
      security: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Flux des messages de la salle d'enchère
    post:
      tags: [Enchères (Auctions)]
      summary: Envoyer un message dans le salon de l'enchère
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  example: Superbe pièce d'artisanat !
      responses:
        "201":
          description: Message diffusé

  /auctions/{productId}/watch:
    post:
      tags: [Enchères (Auctions)]
      summary: S'abonner aux notifications en direct d'une enchère
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Enchère suivie
    delete:
      tags: [Enchères (Auctions)]
      summary: Se désabonner du suivi de l'enchère
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Suivi arrêté

  # ═══════════════════════════════════════════════════════════════════════════
  # 10. Offres d'enchères (Bids)
  # ═══════════════════════════════════════════════════════════════════════════
  /bids:
    post:
      tags: [Offres d'enchères (Bids)]
      summary: Placer une nouvelle enchère sur un article
      description: |
        Vérifie que l'enchère est active, que le montant dépasse l'enchère précédente du pas minimum,
        et prolonge automatiquement l'enchère si l'offre intervient dans les 2 dernières minutes (anti-snipe).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, amount]
              properties:
                productId:
                  type: string
                amount:
                  type: integer
                  description: Montant de l'offre en Ariary (MGA)
                  example: 125000
      responses:
        "201":
          description: Enchère placée avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Bid"
        "409":
          description: Montant insuffisant ou surenchère dépassée

  /bids/me:
    get:
      tags: [Offres d'enchères (Bids)]
      summary: Historique de mes offres d'enchères
      responses:
        "200":
          description: Liste des enchères placées par l'acheteur

  /bids/product/{productId}:
    get:
      tags: [Offres d'enchères (Bids)]
      summary: Historique complet des offres sur un produit
      security: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Liste ordonnée des enchères

  # ═══════════════════════════════════════════════════════════════════════════
  # 11. Panier (Cart)
  # ═══════════════════════════════════════════════════════════════════════════
  /cart:
    get:
      tags: [Panier]
      summary: Obtenir le contenu du panier actuel
      responses:
        "200":
          description: Panier avec calcul des totaux et articles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartResponse"
    delete:
      tags: [Panier]
      summary: Vider l'intégralité du panier
      responses:
        "200":
          description: Panier vidé

  /cart/items:
    post:
      tags: [Panier]
      summary: Ajouter un article au panier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, quantity]
              properties:
                productId:
                  type: string
                quantity:
                  type: integer
                  minimum: 1
                  default: 1
      responses:
        "201":
          description: Article ajouté au panier

  /cart/items/{id}:
    patch:
      tags: [Panier]
      summary: Modifier la quantité d'un article dans le panier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Quantité mise à jour
    delete:
      tags: [Panier]
      summary: Retirer un article du panier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Article retiré

  /cart/checkout-summary:
    post:
      tags: [Panier]
      summary: Calculer le devis de commande (sous-total, livraison, remises)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                addressId:
                  type: string
                shippingZoneId:
                  type: string
      responses:
        "200":
          description: Récapitulatif tarifaire détaillé

  # ═══════════════════════════════════════════════════════════════════════════
  # 12. Favoris (Favorites)
  # ═══════════════════════════════════════════════════════════════════════════
  /favorites:
    get:
      tags: [Favoris]
      summary: Obtenir tous les produits ajoutés aux favoris
      responses:
        "200":
          description: Liste des favoris

  /favorites/{productId}:
    post:
      tags: [Favoris]
      summary: Ajouter un produit aux favoris
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ajouté aux favoris
    delete:
      tags: [Favoris]
      summary: Retirer un produit des favoris
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Retiré des favoris

  # ═══════════════════════════════════════════════════════════════════════════
  # 13. Commandes (Orders)
  # ═══════════════════════════════════════════════════════════════════════════
  /orders:
    get:
      tags: [Commandes]
      summary: Historique des commandes de l'utilisateur
      responses:
        "200":
          description: Liste des commandes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
    post:
      tags: [Commandes]
      summary: Valider et créer une commande à partir du panier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderInput"
      responses:
        "201":
          description: Commande créée en statut PENDING
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Order"

  /orders/{id}:
    get:
      tags: [Commandes]
      summary: Détail complet d'une commande
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Fiche commande trouvée
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Order"

  /orders/{id}/cancel:
    post:
      tags: [Commandes]
      summary: Annuler une commande (si non encore expédiée)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Commande annulée

  /orders/{id}/status:
    patch:
      tags: [Commandes]
      summary: Mettre à jour l'état d'une commande (Vendeur / Admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [PROCESSING, SHIPPED, DELIVERED, CANCELLED]
      responses:
        "200":
          description: Statut mis à jour

  # ═══════════════════════════════════════════════════════════════════════════
  # 14. Paiements (Mobile Money Madagascar)
  # ═══════════════════════════════════════════════════════════════════════════
  /payments/initiate:
    post:
      tags: [Paiements (Mobile Money)]
      summary: Initier un paiement Mobile Money (MVola, Orange Money, Airtel Money)
      description: |
        Déclenche une notification Push USSD vers le téléphone de l'acheteur pour valider la transaction
        avec son code PIN opérateur. En mode présentation / dev, fonctionne sans blocage même si les clés
        sandbox ne sont pas encore renseignées.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, provider, phoneNumber]
              properties:
                orderId:
                  type: string
                  example: cmd_clz9823abc
                provider:
                  type: string
                  enum: [MVOLA, ORANGE_MONEY, AIRTEL_MONEY]
                  example: MVOLA
                phoneNumber:
                  type: string
                  description: Numéro de téléphone opérateur (ex 0340000000, 0320000000, 0330000000)
                  example: "0341234567"
      responses:
        "200":
          description: Paiement initié avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PaymentTransaction"
        "409":
          description: Opérateur indisponible ou solde insuffisant

  /payments/transactions/{id}:
    get:
      tags: [Paiements (Mobile Money)]
      summary: Vérifier le statut d'une transaction de paiement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Détails et statut de la transaction
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PaymentTransaction"

  /payments/order/{orderId}:
    get:
      tags: [Paiements (Mobile Money)]
      summary: Obtenir les transactions liées à une commande
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Transactions de la commande

  /payments/webhooks/{provider}:
    post:
      tags: [Paiements (Mobile Money)]
      summary: Webhook de rappel opérateur (MVola, Orange Money, Airtel Money)
      security: []
      description: Reçoit la notification instantanée de paiement signée avec HMAC-SHA256.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [MVOLA, ORANGE_MONEY, AIRTEL_MONEY]
        - name: x-signature
          in: header
          required: false
          schema:
            type: string
          description: Signature HMAC de l'opérateur
      responses:
        "200":
          description: Notification traitée avec succès

  /payments/transactions/{id}/refund:
    post:
      tags: [Paiements (Mobile Money)]
      summary: Rembourser une transaction (Admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  example: "Article non disponible, accord acheteur"
      responses:
        "200":
          description: Remboursement effectué

  # ═══════════════════════════════════════════════════════════════════════════
  # 15. Suivi de livraison (Delivery Tracking)
  # ═══════════════════════════════════════════════════════════════════════════
  /delivery-tracking/order/{orderId}:
    get:
      tags: [Suivi de livraison]
      summary: Obtenir le suivi d'expédition d'une commande
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Suivi et événements d'expédition

  /delivery-tracking/{trackingNumber}:
    get:
      tags: [Suivi de livraison]
      summary: Suivre un colis via son numéro de tracking public (ex LV-MG-2026-XXXX)
      security: []
      parameters:
        - name: trackingNumber
          in: path
          required: true
          schema:
            type: string
          example: LV-MG-2026-98124
      responses:
        "200":
          description: Historique de livraison du colis

  /delivery-tracking/{id}/events:
    post:
      tags: [Suivi de livraison]
      summary: Ajouter une étape ou un événement d'expédition (Livreur / Admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, description]
              properties:
                status:
                  type: string
                  example: IN_TRANSIT
                description:
                  type: string
                  example: "Colis pris en charge à l'agence Antananarivo Analakely"
                location:
                  type: string
                  example: "Antananarivo"
      responses:
        "201":
          description: Événement ajouté

  # ═══════════════════════════════════════════════════════════════════════════
  # 16. Points Relais (Pickup Points)
  # ═══════════════════════════════════════════════════════════════════════════
  /pickup-points:
    get:
      tags: [Points Relais]
      summary: Lister les points de collecte et relais à Madagascar
      security: []
      parameters:
        - name: city
          in: query
          schema:
            type: string
          example: Antananarivo
      responses:
        "200":
          description: Liste des points relais disponibles
    post:
      tags: [Points Relais]
      summary: Ajouter un nouveau point relais (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PickupPointInput"
      responses:
        "201":
          description: Point relais créé

  /pickup-points/{id}:
    get:
      tags: [Points Relais]
      summary: Détails d'un point relais
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Point relais trouvé
    patch:
      tags: [Points Relais]
      summary: Modifier un point relais (Admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Point relais mis à jour
    delete:
      tags: [Points Relais]
      summary: Supprimer un point relais (Admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Point relais supprimé

  # ═══════════════════════════════════════════════════════════════════════════
  # 17. Zones de livraison (Shipping Zones)
  # ═══════════════════════════════════════════════════════════════════════════
  /shipping-zones:
    get:
      tags: [Zones de livraison]
      summary: Lister les zones et tarifs de livraison
      security: []
      responses:
        "200":
          description: Liste des zones
    post:
      tags: [Zones de livraison]
      summary: Créer une zone tarifaire de livraison (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, baseFee, estimatedDays]
              properties:
                name:
                  type: string
                  example: Antananarivo Intra-Muros
                baseFee:
                  type: integer
                  example: 5000
                estimatedDays:
                  type: integer
                  example: 1
      responses:
        "201":
          description: Zone créée

  /shipping-zones/calculate:
    post:
      tags: [Zones de livraison]
      summary: Calculer le coût de livraison pour une destination donnée
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destinationCity]
              properties:
                destinationCity:
                  type: string
                  example: Tamatave
                orderTotal:
                  type: integer
                  example: 150000
      responses:
        "200":
          description: Devis de transport calculé

  # ═══════════════════════════════════════════════════════════════════════════
  # 18. Cartes & Lieux (Places Service)
  # ═══════════════════════════════════════════════════════════════════════════
  /places/search:
    get:
      tags: [Cartes & Lieux]
      summary: Recherche de lieux et adresses à Madagascar (SerpApi & OpenStreetMap)
      security: []
      description: |
        Permet de géocoder et trouver des adresses à Madagascar sans clé obligatoire.
        Interroge SerpApi si configuré, bascule automatiquement sur OpenStreetMap (Nominatim),
        avec repli de secours instantané.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          example: Analakely Antananarivo
        - name: location
          in: query
          schema:
            type: string
            default: Madagascar
      responses:
        "200":
          description: Résultats de recherche géographique
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlaceResult"

  /places/status:
    get:
      tags: [Cartes & Lieux]
      summary: Fournisseur actif de cartographie (SerpApi / OpenStreetMap)
      security: []
      responses:
        "200":
          description: État et configuration des cartes

  # ═══════════════════════════════════════════════════════════════════════════
  # 19. Retours & Réclamations (Feedback)
  # ═══════════════════════════════════════════════════════════════════════════
  /feedback:
    get:
