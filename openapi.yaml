      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, subject, message]
              properties:
                type:
                  type: string
                  enum: [BUG, COMPLAINT, SUGGESTION, RETURN_REQUEST]
                orderId:
                  type: string
                  nullable: true
                subject:
                  type: string
                  example: "Demande d'échange de taille"
                message:
                  type: string
      responses:
        "201":
          description: Ticket enregistré

  # ═══════════════════════════════════════════════════════════════════════════
  # 20. Notifications
  # ═══════════════════════════════════════════════════════════════════════════
  /notifications:
    get:
      tags: [Notifications]
      summary: Obtenir les notifications de l'utilisateur
      responses:
        "200":
          description: Flux des notifications

  /notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Nombre de notifications non lues
      responses:
        "200":
          description: Compteur

  /notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Marquer une notification comme lue
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Notification marquée comme lue

  /notifications/mark-all-read:
    patch:
      tags: [Notifications]
      summary: Marquer toutes les notifications comme lues
      responses:
        "200":
          description: Toutes les notifications marquées comme lues

  # ═══════════════════════════════════════════════════════════════════════════
  # 21. Messagerie
  # ═══════════════════════════════════════════════════════════════════════════
